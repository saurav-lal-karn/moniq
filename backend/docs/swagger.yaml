basePath: /api/v1
definitions:
  dto.AcceptDeclineInvitationDTO:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  dto.CreateWalletRequestDTO:
    properties:
      currency:
        type: string
      description:
        type: string
      name:
        type: string
      type_id:
        type: string
    required:
    - currency
    - name
    - type_id
    type: object
  dto.CreateWalletTypeRequestDTO:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.CreateWorkspaceMemberDTO:
    properties:
      role:
        enum:
        - owner
        - admin
        - member
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  dto.CreateWorkspaceRequestDTO:
    properties:
      description:
        type: string
      name:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/model.WorkspaceType'
        enum:
        - personal
        - family
        - team
    required:
    - name
    - type
    type: object
  dto.InviteUserToWorkspaceDTO:
    properties:
      email:
        type: string
      role:
        enum:
        - owner
        - admin
        - member
        type: string
    required:
    - email
    - role
    type: object
  dto.LoginRequestDTO:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponseDTO:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.LogoutRequestDTO:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshRequestDTO:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshResponseDTO:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.RegisterRequestDTO:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  dto.RemoveInvitationDTO:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  dto.ResendInvitationDTO:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  dto.RevokeInvitationDTO:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  dto.UpdateWorkspaceRequestDTO:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/model.WorkspaceType'
        enum:
        - personal
        - family
        - team
    required:
    - id
    - name
    - type
    type: object
  helper.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  model.WorkspaceType:
    enum:
    - personal
    - family
    - team
    type: string
    x-enum-varnames:
    - PersonalWorkspace
    - FamilyWorkspace
    - TeamWorkspace
info:
  contact:
    email: sauravkarn541@gmail.com
    name: API Support
    url: http://github.com/saurav-lal-karn/moniq/issues
  description: This is the API documentation for the Moniq Backend.
  termsOfService: http://example.com/terms/
  title: Moniq Backend API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.LoginResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout the user
      parameters:
      - description: Logout Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /auth/logout-all:
    get:
      consumes:
      - application/json
      description: Logout the user from all devices
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Logout from all devices
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Details of logged in user
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.LoginResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Me
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh token for user
      parameters:
      - description: Refresh token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RefreshResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      summary: Refresh token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      summary: Register user
      tags:
      - Auth
  /invitation/accept:
    post:
      consumes:
      - application/json
      description: accept inviteto workspace
      parameters:
      - description: Accept invitation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AcceptDeclineInvitationDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: accept invite to workspace
      tags:
      - WorkspaceInvitation
  /invitation/decline:
    post:
      consumes:
      - application/json
      description: decline invite to workspace
      parameters:
      - description: Decline invitation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AcceptDeclineInvitationDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: decline invite to workspace
      tags:
      - WorkspaceInvitation
  /invitation/details:
    get:
      consumes:
      - application/json
      description: get invitation details by token
      parameters:
      - description: Token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      summary: get invitation details
      tags:
      - WorkspaceInvitation
  /invitation/revoke:
    post:
      consumes:
      - application/json
      description: remove invitation to workspace
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      - description: Remove invitation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RemoveInvitationDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      summary: remove invitation to workspace
      tags:
      - WorkspaceInvitation
  /invite/resend:
    post:
      consumes:
      - application/json
      description: resend invitation to workspace
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      - description: Resend Invite User To Workspace Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResendInvitationDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: resend invitation to workspace
      tags:
      - WorkspaceInvitation
  /wallet:
    get:
      consumes:
      - application/json
      description: List of wallets
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: List Wallets
      tags:
      - Wallet
    post:
      consumes:
      - application/json
      description: create wallet in workspace
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      - description: Create Wallet Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateWalletRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: create wallet in workspace
      tags:
      - Wallet
  /wallet-type:
    get:
      consumes:
      - application/json
      description: List of wallet types
      parameters:
      - description: Workspace ID
        in: header
        name: X-Workspace-Id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: List Wallet Type
      tags:
      - Wallet Type
    post:
      consumes:
      - application/json
      description: create wallet type in workspace
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      - description: Create Wallet Type Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateWalletTypeRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: create wallet type in workspace
      tags:
      - Wallet Type
  /wallet-type/{id}:
    delete:
      consumes:
      - application/json
      description: Delete Wallet Type
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      - description: Wallet Type Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Delete wallet type
      tags:
      - Wallet Type
  /workspace/{id}:
    delete:
      consumes:
      - application/json
      description: Delete Workspace
      parameters:
      - description: Workspace Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Delete workspace
      tags:
      - Workspace
    put:
      consumes:
      - application/json
      description: Update Workspace
      parameters:
      - description: Workspace Id
        in: path
        name: id
        required: true
        type: string
      - description: Updated workspace details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateWorkspaceRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Update workspace
      tags:
      - Workspace
  /workspace/create:
    post:
      consumes:
      - application/json
      description: Create workspace
      parameters:
      - description: CreateWorkspace Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateWorkspaceRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Create workspace
      tags:
      - Workspace
  /workspace/details/{id}:
    get:
      consumes:
      - application/json
      description: Get Workspace details
      parameters:
      - description: Workspace Id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Get workspace details
      tags:
      - Workspace
  /workspace/invite:
    get:
      consumes:
      - application/json
      description: list invitations to workspace
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: list invitations to workspace
      tags:
      - WorkspaceInvitation
    post:
      consumes:
      - application/json
      description: invite a person to workspace
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      - description: Invite User To Workspace Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.InviteUserToWorkspaceDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: invite to workspace
      tags:
      - WorkspaceInvitation
  /workspace/list:
    get:
      consumes:
      - application/json
      description: List of user's workspaces
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: List My Workspace
      tags:
      - Workspace
  /workspace/member:
    get:
      consumes:
      - application/json
      description: List members of workspace
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: List members in workspace
      tags:
      - WorkspaceMember
    post:
      consumes:
      - application/json
      description: Add member to workspace
      parameters:
      - description: Workspace ID
        in: header
        name: x-workspace-id
        required: true
        type: string
      - description: CreateWorkspace Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateWorkspaceMemberDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helper.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Add member in workspace
      tags:
      - WorkspaceMember
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
